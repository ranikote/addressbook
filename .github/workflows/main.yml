name: Testing workflow variables

on:
  workflow_dispatch

env:
  cloud: google-cloud

jobs:
  greeting_job:
    runs-on: AWS-hosted-Runner

    env:
      Greeting: Hello

    steps:
      - name: "Say Hello Mona it's Monday"
        run: echo "$Greeting $First_name is using $cloud!"
        env:
          First_name: Vishal
